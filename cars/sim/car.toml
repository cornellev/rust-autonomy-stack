# Desktop "car": the same stack, run against the simulator instead of hardware.
# No [deploy] section -- there is nowhere to deploy to.

name = "sim"
description = "Desktop stack, no vehicle"

[env]
RUST_LOG = "debug"

# Headless RoboSense decoder. Reads lidar.yaml beside this file.
[[nodes]]
name = "perception"
package = "virtual-rgbd-sensor"
bin = "zenoh_wrapper"

[[nodes]]
name = "planning"
package = "costmap_planner_rs"
bin = "a_star"

[[nodes]]
name = "control"
package = "pure_pursuit"

# Same binary as the car. The dry-run profile prints ackermann instead of opening the Pico.
[[nodes]]
name = "teleop"
package = "teleop"
profile = "dry-run"

# Local-only crate at nodes/deadreckoning. Skipped when that directory is absent.
[[nodes]]
name = "deadreckoning"
package = "cev_odometry"
optional = true
