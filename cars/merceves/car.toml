# MerCEVes -- medium-size autonomous testbed.
#
# This file is deployment truth: which nodes run, how they start, where they go.
# Vehicle geometry, CAN IDs and sensor extrinsics are hardware truth; they have
# no home yet (see README) and are deliberately not duplicated here. Files next
# to this one are rsynced to <install_dir>/config on the car, and every node is
# started with CEV_CAR_DIR pointing at that directory.

name = "merceves"
description = "MerCEVes autonomous testbed (Jetson)"

[env]
RUST_LOG = "info"

[deploy]
host = "10.52.8.219"
user = "mini-dos"
target = "aarch64-unknown-linux-gnu"
builder = "cross"                 # "cross" (docker) or "cargo" (host linker)
install_dir = "/opt/cev"
# restart_cmd = "systemctl --user restart cev.target"

# rust-inekf exits after one print, and launch stops every node when one exits.
[[nodes]]
name = "estimation"
package = "rust-inekf"
enabled = false

# Headless RoboSense decoder. Reads lidar.yaml beside this file.
[[nodes]]
name = "perception"
package = "virtual-rgbd-sensor"
bin = "zenoh_wrapper"

[[nodes]]
name = "planning"
package = "costmap_planner_rs"
bin = "a_star"

[[nodes]]
name = "control"
package = "pure_pursuit"

# Prints ackermann from cev/commands/control. The dry-run profile stays off the Pico until a live test.
[[nodes]]
name = "teleop"
package = "teleop"
# profile = "dry-run"

# SPI IMU on /dev/spidev0.0. Prints samples. Panics if the device is missing,
# and launch then stops every other node.
[[nodes]]
name = "imu-gps"
package = "imu-gps-node"
enabled = false

# Local-only crate at nodes/deadreckoning. Skipped when that directory is absent.
[[nodes]]
name = "deadreckoning"
package = "cev_odometry"
optional = true
