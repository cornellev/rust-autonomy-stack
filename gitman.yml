  - repo: https://github.com/cornellev/costmap-planner-rust
    name: costmap-planner-rust
    rev: zenoh-impl
    type: git
    params:
    sparse_paths:
      -
    links:
      - source: costmap_planner_rs
        target: nodes/planning
    scripts:
      -
    patches:
      -
  - repo: https://github.com/cornellev/pure_pursuit
    name: pure_pursuit
    rev: master
    type: git
    params:
    sparse_paths:
      -
    links:
      - source: ''
        target: nodes/control
    scripts:
      -
    patches:
      -
  - repo: https://github.com/cornellev/urban-concept
    name: urban-concept
    rev: erica/merceves
    type: git
    params:
    sparse_paths:
      - auto/teleop
      - auto/imu-gps-node
      - auto/gamepad
    links:
      - source: auto/teleop
        target: nodes/teleop
      - source: auto/imu-gps-node
        target: nodes/imu-gps
      - source: auto/gamepad
        target: nodes/gamepad
    scripts:
      -
    patches:
      -
groups:
  # `uvx gitman install cargo` pulls only what the workspace build needs.
  - name: cargo
    members:
      - rust-inekf
      - holdover-ekf
      - rust-autonomy-sensors
      - virtual-rgbd-sensor
      - costmap-planner-rust
      - pure_pursuit
      - urban-concept
default_group: ''
